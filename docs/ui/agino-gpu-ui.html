<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agino-gpu 界面设计</title>
<style>
/* Layout: one column of mockups, each under a one-line heading; DDE V25 / DTK look; wide mockups scroll inside their own frame. */
:root {
  --page: #eef1f5; --ink: #1d2733; --muted: #5f6b78; --rule: #d5dbe3; --note: #ffffff;
  --accent: #0081ff; --accent-soft: rgba(0,129,255,.12); --accent-ink: #ffffff;
  --win: #f7f7f7; --panel: #ffffff; --row: rgba(0,0,0,.04); --row-hover: rgba(0,0,0,.07);
  --side: #ececec; --text: #000000d9; --text2: #00000080; --line: rgba(0,0,0,.08);
  --popup: rgba(250,250,250,.96); --dock: rgba(235,235,235,.92); --shadow: 0 8px 28px rgba(0,0,0,.18);
  --ok: #19a05c; --warn: #d98a00; --warn-soft: rgba(217,138,0,.13); --bad: #e5484d; --bad-soft: rgba(229,72,77,.12);
  --sleep: #8a96a3; --tile-off: rgba(0,0,0,.12); --tile-off-ink: #00000099;
  --f-ui: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #15191e; --ink: #e4e9ef; --muted: #9aa6b2; --rule: #2b333c; --note: #1c2228;
  --accent: #2f8cff; --accent-soft: rgba(47,140,255,.2); --accent-ink: #ffffff;
  --win: #202020; --panel: #2a2a2a; --row: rgba(255,255,255,.05); --row-hover: rgba(255,255,255,.09);
  --side: #1b1b1b; --text: #ffffffde; --text2: #ffffff85; --line: rgba(255,255,255,.09);
  --popup: rgba(40,40,40,.96); --dock: rgba(30,30,30,.92); --shadow: 0 8px 28px rgba(0,0,0,.55);
  --ok: #3cc47c; --warn: #f0a52a; --warn-soft: rgba(240,165,42,.16); --bad: #ff6b6f; --bad-soft: rgba(255,107,111,.15);
  --sleep: #7d8894; --tile-off: rgba(255,255,255,.14); --tile-off-ink: #ffffffaa; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #15191e; --ink: #e4e9ef; --muted: #9aa6b2; --rule: #2b333c; --note: #1c2228;
  --accent: #2f8cff; --accent-soft: rgba(47,140,255,.2); --accent-ink: #ffffff;
  --win: #202020; --panel: #2a2a2a; --row: rgba(255,255,255,.05); --row-hover: rgba(255,255,255,.09);
  --side: #1b1b1b; --text: #ffffffde; --text2: #ffffff85; --line: rgba(255,255,255,.09);
  --popup: rgba(40,40,40,.96); --dock: rgba(30,30,30,.92); --shadow: 0 8px 28px rgba(0,0,0,.55);
  --ok: #3cc47c; --warn: #f0a52a; --warn-soft: rgba(240,165,42,.16); --bad: #ff6b6f; --bad-soft: rgba(255,107,111,.15);
  --sleep: #7d8894; --tile-off: rgba(255,255,255,.14); --tile-off-ink: #ffffffaa; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--page); color: var(--ink); font: 14px/1.6 var(--f-ui); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 36px }
h1 { font-size: 24px; line-height: 1.3; margin: 0; text-wrap: balance }
h2 { font-size: 16px; margin: 0; color: var(--muted); font-weight: 600 }
section { display: grid; gap: 12px; border-top: 1px solid var(--rule); padding-top: 16px }
.scen { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--page); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px }
.scen button { font: inherit; font-size: 13px; border: 1px solid var(--rule); background: var(--note); color: var(--ink); padding: 5px 12px; border-radius: 16px; cursor: pointer }
.scen button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
button:focus-visible, [role="radio"]:focus-visible, [role="button"]:focus-visible, [role="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.frame { overflow-x: auto; padding: 4px }
.pair { display: flex; gap: 24px; align-items: flex-start; width: max-content }

/* ---------- DDE mock primitives ---------- */
.mock { font-family: var(--f-ui); color: var(--text); font-size: 13px }
.ico { width: 20px; height: 20px; display: block }
.tag { display: inline-flex; align-items: center; font-size: 11.5px; padding: 0 7px; height: 20px; border-radius: 10px; background: var(--row); color: var(--text2); white-space: nowrap }
.state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block }
.btn { font: inherit; font-size: 13px; height: 30px; padding: 0 14px; border-radius: 8px; border: none; background: var(--row-hover); color: var(--text); cursor: pointer; white-space: nowrap }
.btn.primary { background: var(--accent); color: var(--accent-ink) }
.btn.link { background: transparent; color: var(--accent); padding: 0 4px }
.btn.icon { width: 28px; padding: 0; color: var(--text2) }
.banner { border-radius: 10px; padding: 8px 10px 8px 12px; display: flex; gap: 10px; align-items: center; font-size: 12.5px }
.banner > span { flex: 1; min-width: 0 }
.banner.warn { background: var(--warn-soft) }
.banner.bad { background: var(--bad-soft) }
.banner.info { background: var(--accent-soft) }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--text2); display: grid; place-items: center; flex: none }
[aria-checked="true"] > .radio { border-color: var(--accent); background: var(--accent) }
[aria-checked="true"] > .radio::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-ink) }
.appico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex: none }
.appico.file { background: var(--row-hover); color: var(--text2) }
.chk { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--text2); flex: none; display: grid; place-items: center; cursor: pointer }
.chk.on { background: var(--accent); border-color: var(--accent) }
.chk.on::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--accent-ink); border-top: none; border-right: none; transform: rotate(-45deg) translateY(-1px) }
.chk.dis { opacity: .4; cursor: default }
.switch { width: 38px; height: 22px; border-radius: 11px; background: var(--row-hover); position: relative; flex: none; cursor: pointer; border: none; padding: 0 }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3) }
.switch.on { background: var(--accent) }
.switch.on::after { left: 19px }

/* quick panel */
.qpanel { width: 352px; background: var(--popup); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; backdrop-filter: blur(20px) }
.qgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
.qt { background: var(--row); border-radius: 12px; min-height: 64px }
.qt.small { display: grid; place-items: center; gap: 2px; font-size: 11.5px; color: var(--text2); text-align: center; padding: 6px }
.qt.small .c { width: 30px; height: 30px; border-radius: 50%; background: var(--tile-off); color: var(--tile-off-ink); display: grid; place-items: center; font-size: 11px }
.qt.two { grid-column: span 2; display: grid; grid-template-columns: minmax(0,1fr) 28px; overflow: hidden }
.qt.two .main { display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 8px; align-items: center; padding: 8px 0 8px 10px; min-width: 0 }
.qt.two .c { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink) }
.qt.two.off .c { background: var(--tile-off); color: var(--tile-off-ink) }
.qt.two .n { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.qt.two .s { font-size: 11.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.qt.two .go { display: grid; place-items: center; color: var(--text2); border-left: 1px solid var(--line); font-size: 16px }
.qt.two.gpu { cursor: pointer; outline: 2px dashed var(--accent); outline-offset: 2px }
.qslider { grid-column: span 4; background: var(--row); border-radius: 12px; height: 40px; display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 8px; padding: 0 12px; color: var(--text2); font-size: 11px }
.qslider i { display: block; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) 62%, var(--tile-off) 62%) }
.qsub { display: grid; gap: 10px }
.qhead { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; align-items: center; gap: 6px }
.qback { width: 28px; height: 28px; border-radius: 8px; border: none; background: var(--row-hover); color: var(--text); font: inherit; font-size: 16px; cursor: pointer }
.qhead .t { font-size: 15px; font-weight: 600 }
.gtitle { font-size: 12px; color: var(--text2); padding: 2px 4px 6px }
.group { background: var(--row); border-radius: 10px; overflow: hidden }
.opt { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; border-top: 1px solid var(--line) }
.opt:first-child { border-top: none }
.opt:hover { background: var(--row-hover) }
.app { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--line) }
.app:first-child { border-top: none }
.qfoot { display: flex; justify-content: flex-end }

/* notification */
.notify { width: 340px; background: var(--popup); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: center }
.notify .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center }
.notify .t { font-weight: 600 }
.notify .b { font-size: 12.5px; color: var(--text2) }

/* context menus */
.menus { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start }
.menu { width: 220px; background: var(--popup); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: grid }
.menu .mi { padding: 6px 12px; border-radius: 6px }
.menu .mi.new { background: var(--accent); color: var(--accent-ink) }
.menu .sep { height: 1px; background: var(--line); margin: 4px 8px }

/* control center */
.dcc { width: 900px; height: 700px; background: var(--win); border-radius: 12px; box-shadow: var(--shadow); display: grid; grid-template-columns: 210px minmax(0,1fr); overflow: hidden }
.dside { background: var(--side); padding: 44px 10px 10px; display: grid; align-content: start; gap: 2px }
.dside .search { height: 30px; border-radius: 8px; background: var(--row-hover); margin: 0 4px 10px; display: flex; align-items: center; padding: 0 10px; color: var(--text2); font-size: 12px }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px }
.nav.sel { background: var(--accent); color: var(--accent-ink) }
.nav .ni { width: 22px; height: 22px; border-radius: 6px; background: var(--row-hover); display: grid; place-items: center; font-size: 11px }
.nav.sel .ni { background: rgba(255,255,255,.25) }
.dmain { display: grid; grid-template-rows: 44px minmax(0,1fr) auto; min-width: 0; min-height: 0 }
.titlebar { display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text2) }
.titlebar b { color: var(--text); font-weight: 500 }
.titlebar a { color: var(--text2); cursor: pointer }
.titlebar a:hover { color: var(--accent) }
.titlebar .wc { margin-left: auto; display: flex; gap: 14px }
.dcontent { overflow-y: auto; padding: 4px 28px 28px; display: grid; gap: 18px; align-content: start; min-height: 0 }
.dfoot { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 28px; border-top: 1px solid var(--line) }
.dgroup { display: grid; gap: 6px }
.dgroup > .h { font-size: 14px; font-weight: 600; padding: 0 2px; display: flex; align-items: baseline; gap: 10px }
.dgroup > .h .sub { font-weight: 400; font-size: 12px; color: var(--text2) }
.dgroup.off .card, .dgroup.off .h { opacity: .5 }
.card { background: var(--panel); border-radius: 10px; overflow: hidden }
.crow { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); min-height: 46px }
.crow:first-child { border-top: none }
.crow.link { cursor: pointer }
.crow.link:hover { background: var(--row) }
.crow .lead { display: flex; gap: 12px; align-items: center; min-width: 0 }
.crow .lead > div { min-width: 0 }
.crow .n { font-weight: 500 }
.crow .d { font-size: 12px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.crow .add { color: var(--accent); font-weight: 500 }
.ctrls { display: flex; gap: 10px; align-items: center }
.gpuico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--row-hover) }
.modes { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px }
.mode { background: var(--panel); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; cursor: pointer; border: 2px solid transparent; align-content: start }
.mode:hover { background: var(--row-hover) }
.mode[aria-checked="true"] { border-color: var(--accent) }
.mode[aria-disabled="true"] { opacity: .4; cursor: not-allowed }
.mode .top { display: flex; align-items: center; justify-content: space-between; gap: 6px }
.mode .n { font-weight: 600; font-size: 14px }
.mode .d { font-size: 12px; color: var(--text2) }
.select { height: 30px; border-radius: 8px; background: var(--row-hover); padding: 0 10px; display: inline-flex; align-items: center; font-size: 12.5px; white-space: nowrap }
.searchbox { height: 32px; border-radius: 8px; background: var(--row-hover); display: flex; align-items: center; padding: 0 10px; color: var(--text2); font-size: 12.5px }
.dispsnip { width: 600px; background: var(--win); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 22px; display: grid; gap: 8px }
@media (prefers-reduced-motion: no-preference) { .opt, .mode, .btn, .crow.link { transition: background .15s, border-color .15s } }
</style>

<div class="wrap">
  <h1>agino-gpu 界面设计（草案 3）</h1>

  <nav class="scen" aria-label="场景">
    <button type="button" data-scen="idle" aria-pressed="true">混合 · 独显休眠</button>
    <button type="button" data-scen="busy" aria-pressed="false">混合 · 独显工作中</button>
    <button type="button" data-scen="pending" aria-pressed="false">待重启</button>
    <button type="button" data-scen="ext" aria-pressed="false">外接显示器在独显上</button>
    <button type="button" data-scen="fail" aria-pressed="false">上次切换失败</button>
    <button type="button" data-scen="mux" aria-pressed="false">独显直连</button>
  </nav>

  <section>
    <h2>快捷面板</h2>
    <div class="frame"><div class="pair">
      <div class="qpanel mock" id="qhome"></div>
      <div class="qpanel mock" id="qsub"></div>
    </div></div>
  </section>

  <section>
    <h2>通知</h2>
    <div class="frame"><div class="notify mock">
      <span class="ic"><svg class="ico" viewBox="0 0 20 20"><path d="M10 3 18 17H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 8v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1" fill="currentColor"/></svg></span>
      <div><div class="t">显卡模式切换失败</div><div class="b">已恢复为混合</div></div>
      <button class="btn" type="button">详情</button>
    </div></div>
  </section>

  <section>
    <h2>控制中心 · 显示</h2>
    <div class="frame"><div class="dispsnip mock" id="dispsnip"></div></div>
  </section>

  <section>
    <h2>控制中心 · 显卡</h2>
    <div class="frame"><div class="dcc mock" id="dcc"></div></div>
  </section>

  <section>
    <h2>右键菜单</h2>
    <div class="frame"><div class="menus mock">
      <div class="menu"><div class="mi">打开</div><div class="mi new">使用独立显卡运行</div><div class="sep"></div><div class="mi">发送到桌面</div><div class="mi">发送到任务栏</div><div class="mi">开机自动启动</div><div class="sep"></div><div class="mi">卸载</div></div>
      <div class="menu"><div class="mi">Blender</div><div class="mi new">使用独立显卡运行</div><div class="sep"></div><div class="mi">从任务栏取消驻留</div><div class="mi">关闭所有</div></div>
    </div></div>
  </section>
</div>

<script>
(function () {
  "use strict";
  var GPU_SVG = function (kind) {
    var chip = '<rect x="4.5" y="4.5" width="11" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
      '<path d="M7.5 2v2.5M10 2v2.5M12.5 2v2.5M7.5 15.5V18M10 15.5V18M12.5 15.5V18M2 7.5h2.5M2 10h2.5M2 12.5h2.5M15.5 7.5H18M15.5 10H18M15.5 12.5H18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';
    var inner = {
      hybrid: '<path d="M7.5 12.5 12.5 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="7" y="7" width="2.6" height="2.6" rx=".6" fill="currentColor"/><rect x="10.4" y="10.4" width="2.6" height="2.6" rx=".6" fill="currentColor"/>',
      integrated: '<path d="M10 7.2c1.8 1.4 2.6 2.8 1.8 4.1-.8 1.2-2.8 1.3-3.7.2-.9-1.2-.3-2.9 1.9-4.3z" fill="currentColor"/>',
      dedicated: '<path d="M10.8 6.8 8 10.6h2.3l-1.1 2.8 2.9-4h-2.3z" fill="currentColor"/>',
      mux: '<path d="M10.8 6.8 8 10.6h2.3l-1.1 2.8 2.9-4h-2.3z" fill="currentColor"/><circle cx="10" cy="10" r="4.2" fill="none" stroke="currentColor" stroke-width="1"/>'
    }[kind];
    return '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true">' + chip + inner + '</svg>';
  };
  // name, one-line summary (control center only), how it takes effect
  var MODES = [
    { id: "hybrid", name: "混合", d: "按需使用独显", cost: "" },
    { id: "integrated", name: "集显", d: "最省电", cost: "需重启" },
    { id: "dedicated", name: "独显优先", d: "全部由独显渲染", cost: "需注销" },
    { id: "mux", name: "独显直连", d: "性能最佳", cost: "需重启" }
  ];
  var MODE = {}; MODES.forEach(function (m) { MODE[m.id] = m; });
  var SCEN = {
    idle:    { active: "hybrid", configured: "hybrid", dgpu: "sleep", users: [], banner: null },
    busy:    { active: "hybrid", configured: "hybrid", dgpu: "active", users: [["Steam", "#1b2838", "S"], ["Blender", "#e87d0d", "B"]], banner: "flatpak" },
    pending: { active: "hybrid", configured: "integrated", dgpu: "sleep", users: [], banner: null },
    ext:     { active: "hybrid", configured: "hybrid", dgpu: "active", users: [], banner: "ext", ext: true },
    fail:    { active: "hybrid", configured: "hybrid", dgpu: "sleep", users: [], banner: "fail" },
    mux:     { active: "mux", configured: "mux", dgpu: "active", users: [], banner: null }
  };
  var INSTALLED = [["Steam", "#1b2838", "S", "steam"], ["Blender", "#e87d0d", "B", "blender"], ["DaVinci Resolve", "#3a3f4b", "D", "resolve"],
    ["Godot Engine", "#478cbf", "G", "godot"], ["OBS Studio", "#302e31", "O", "obs"], ["Kdenlive", "#2e6db4", "K", "kdenlive"]];
  var S = null, RULES = null;
  var UI = { qview: "home", dview: "main", picked: {}, file: null, mkEntry: true, batt: true };

  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function dgpu(s) {
    if (s.active === "integrated") return ["已关闭", "var(--sleep)"];
    return s.dgpu === "sleep" ? ["休眠", "var(--sleep)"] : ["工作中", "var(--ok)"];
  }
  function stateHTML(s) { var d = dgpu(s); return '<span class="state" style="color:' + d[1] + '"><span class="dot"></span>' + d[0] + '</span>'; }
  function pending(s) {
    if (s.configured === s.active) return null;
    return { mode: MODE[s.configured], how: (s.configured === "dedicated" && s.active !== "mux") ? "注销" : "重启" };
  }
  function costOf(m, s) {
    if (m.id === s.configured) return "";
    if (s.active === "mux" || m.id === "mux") return "需重启";
    return m.cost;
  }
  function banner(s) {
    var p = pending(s);
    if (p) return '<div class="banner warn"><span>' + p.how + '后切换到' + esc(p.mode.name) + '</span><button class="btn" type="button" data-act="undo">撤销</button><button class="btn primary" type="button">立即' + p.how + '</button></div>';
    if (s.banner === "ext") return '<div class="banner warn"><span>HDMI-1 接在独显上，集显模式下不可用</span></div>';
    if (s.banner === "fail") return '<div class="banner bad"><span>切换到独显优先失败，已恢复为混合</span><button class="btn link" type="button">详情</button><button class="btn icon" type="button" data-act="dismiss" aria-label="关闭">×</button></div>';
    if (s.banner === "flatpak") return '<div class="banner info"><span>Flatpak 缺少 NVIDIA 运行时</span><button class="btn link" type="button">安装</button></div>';
    return "";
  }
  function tileSub(s) {
    var p = pending(s);
    if (p) return ["待" + p.how, "var(--warn)"];
    if (s.banner === "fail") return ["切换失败", "var(--bad)"];
    return [MODE[s.active].name, "var(--text2)"];
  }

  function renderQuick() {
    var s = S, sub = tileSub(s);
    document.getElementById("qhome").innerHTML = '<div class="qgrid">' +
      '<div class="qt two"><div class="main"><span class="c"><svg class="ico" viewBox="0 0 20 20"><path d="M2 8a12 12 0 0 1 16 0M5 11a8 8 0 0 1 10 0M8 14a3.5 3.5 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="16.5" r="1.2" fill="currentColor"/></svg></span><div style="min-width:0"><div class="n">无线网络</div><div class="s">agino-office</div></div></div><span class="go">›</span></div>' +
      '<div class="qt two off"><div class="main"><span class="c"><svg class="ico" viewBox="0 0 20 20"><path d="m6 6 8 8-4 3V3l4 3-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div style="min-width:0"><div class="n">蓝牙</div><div class="s">已关闭</div></div></div><span class="go">›</span></div>' +
      '<div class="qt two gpu" role="button" tabindex="0" data-q="sub" aria-label="显卡"><div class="main"><span class="c">' + GPU_SVG(s.active) + '</span><div style="min-width:0"><div class="n">显卡</div><div class="s" style="color:' + sub[1] + '">' + esc(sub[0]) + '</div></div></div><span class="go">›</span></div>' +
      '<div class="qt small"><span class="c">护</span>护眼模式</div><div class="qt small"><span class="c">飞</span>飞行模式</div>' +
      '<div class="qslider"><span>亮度</span><i></i></div><div class="qslider"><span>音量</span><i></i></div></div>';
    var visible = MODES.filter(function (m) { return s.active === "mux" ? (m.id === "mux" || m.id === "hybrid") : true; });
    var opts = visible.map(function (m) {
      var c = costOf(m, s);
      return '<div class="opt" role="radio" tabindex="0" aria-checked="' + (m.id === s.configured) + '" data-mode="' + m.id + '"><span class="radio"></span><span>' + esc(m.name) + '</span>' + (c ? '<span class="tag">' + c + '</span>' : "<span></span>") + '</div>';
    }).join("");
    var users = s.users.length && s.active === "hybrid"
      ? '<div><div class="gtitle">正在使用独显</div><div class="group">' + s.users.map(function (u) { return '<div class="app"><span class="appico" style="background:' + u[1] + '">' + esc(u[2]) + '</span><span>' + esc(u[0]) + '</span></div>'; }).join("") + '</div></div>'
      : "";
    document.getElementById("qsub").innerHTML = '<div class="qsub">' +
      '<div class="qhead"><button class="qback" type="button" data-q="home" aria-label="返回">‹</button><span class="t">显卡</span>' + stateHTML(s) + '</div>' +
      banner(s) +
      '<div class="group" role="radiogroup" aria-label="显卡模式">' + opts + '</div>' + users +
      '<div class="qfoot"><button class="btn link" type="button">显卡设置</button></div></div>';
    document.getElementById("qhome").style.opacity = UI.qview === "home" ? "1" : ".55";
    document.getElementById("qsub").style.opacity = UI.qview === "sub" ? "1" : ".55";
  }

  function renderDispSnip() {
    var s = S, p = pending(s);
    document.getElementById("dispsnip").innerHTML =
      '<div style="font-size:15px;font-weight:600;padding:0 2px 4px">显示</div>' +
      '<div class="card"><div class="crow"><span class="n">亮度</span><span class="select">80%</span></div>' +
      '<div class="crow"><span class="n">缩放</span><span class="select">150% ▾</span></div>' +
      '<div class="crow"><span class="n">护眼模式</span><span class="switch"></span></div></div>' +
      '<div class="card"><div class="crow link"><span class="n">显卡</span><div class="ctrls"><span style="color:' + (p ? "var(--warn)" : "var(--text2)") + '">' + (p ? "待" + p.how : esc(MODE[s.active].name)) + '</span><span aria-hidden="true">›</span></div></div></div>';
  }

  function dccMain(s) {
    var mux = s.active === "mux";
    var gpus =
      (mux ? "" : '<div class="crow"><div class="lead"><span class="gpuico">' + GPU_SVG("integrated") + '</span><div><div class="n">Intel Arc Graphics</div><div class="d">i915 · eDP-1</div></div></div><span></span></div>') +
      '<div class="crow"><div class="lead"><span class="gpuico">' + GPU_SVG("dedicated") + '</span><div><div class="n">NVIDIA GeForce RTX 5080 Laptop GPU</div><div class="d">nvidia 580.178.04' + (s.ext ? " · HDMI-1" : (mux ? " · eDP-1" : "")) + '</div></div></div>' + stateHTML(s) + '</div>';
    var modes = MODES.map(function (m) {
      var dis = mux && m.id !== "mux" && m.id !== "hybrid", c = costOf(m, s);
      return '<div class="mode" role="radio" tabindex="0" aria-checked="' + (m.id === s.configured) + '" aria-disabled="' + dis + '" data-mode="' + m.id + '">' +
        '<div class="top"><span class="n">' + esc(m.name) + '</span>' + (c ? '<span class="tag">' + c + '</span>' : "") + '</div><div class="d">' + esc(m.d) + '</div></div>';
    }).join("");
    var off = s.active !== "hybrid";
    var rows = RULES.map(function (r, i) {
      var ico = r.kind === "file" ? '<span class="appico file">▸</span>' : '<span class="appico" style="background:' + r.col + '">' + esc(r.ch) + '</span>';
      return '<div class="crow"><div class="lead">' + ico + '<div><div class="n">' + esc(r.name) + '</div>' + (r.kind === "file" ? '<div class="d">' + esc(r.path) + '</div>' : "") + '</div></div><button class="btn icon" type="button" data-del="' + i + '" aria-label="移除 ' + esc(r.name) + '">×</button></div>';
    }).join("");
    return '<div class="dcontent">' + banner(s) +
      '<div class="dgroup"><div class="card">' + gpus + '</div></div>' +
      '<div class="dgroup"><div class="h">模式</div><div class="modes" role="radiogroup" aria-label="显卡模式">' + modes + '</div></div>' +
      '<div class="dgroup' + (off ? " off" : "") + '"><div class="h">使用独显的应用' + (off ? '<span class="sub">仅混合模式</span>' : "") + '</div><div class="card">' + rows +
      '<div class="crow link" role="button" tabindex="0" data-d="add"><span class="add">添加</span><span aria-hidden="true">›</span></div>' +
      '<div class="crow"><span>使用电池时暂停</span><button class="switch' + (UI.batt ? " on" : "") + '" type="button" data-d="batt" aria-label="使用电池时暂停"></button></div></div></div>' +
      '</div><div></div>';
  }

  function dccAdd() {
    var added = {}; RULES.forEach(function (r) { if (r.kind === "app") added[r.id] = true; });
    var rows = INSTALLED.map(function (a) {
      var isAdded = !!added[a[3]], on = isAdded || !!UI.picked[a[3]];
      return '<div class="crow"><div class="lead"><span class="appico" style="background:' + a[1] + '">' + a[2] + '</span><span>' + esc(a[0]) + '</span></div>' +
        '<span class="chk' + (on ? " on" : "") + (isAdded ? " dis" : "") + '" role="checkbox" aria-checked="' + on + '" aria-label="' + esc(a[0]) + '" tabindex="0" data-pick="' + (isAdded ? "" : a[3]) + '"></span></div>';
    }).join("");
    var file = UI.file
      ? '<div class="crow"><div class="lead"><span class="appico file">▸</span><div><div class="n">' + esc(UI.file.name) + '</div><div class="d">' + esc(UI.file.dir) + '</div></div></div><button class="btn icon" type="button" data-d="unfile" aria-label="移除">×</button></div>' +
        '<div class="crow"><span>添加到启动器</span><button class="switch' + (UI.mkEntry ? " on" : "") + '" type="button" data-d="mkentry" aria-label="添加到启动器"></button></div>'
      : '<div class="crow link" role="button" tabindex="0" data-d="browse"><span class="add">选择文件…</span><span></span></div>';
    var n = Object.keys(UI.picked).filter(function (k) { return UI.picked[k]; }).length + (UI.file ? 1 : 0);
    return '<div class="dcontent">' +
      '<div class="dgroup"><div class="searchbox">搜索</div><div class="card">' + rows + '</div></div>' +
      '<div class="dgroup"><div class="h">其他程序<span class="sub">从启动器启动时生效</span></div><div class="card">' + file + '</div></div>' +
      '</div><div class="dfoot"><button class="btn" type="button" data-d="main">取消</button><button class="btn primary" type="button" data-d="commit"' + (n ? "" : " disabled") + ' style="' + (n ? "" : "opacity:.5") + '">添加' + (n ? "（" + n + "）" : "") + '</button></div>';
  }

  function renderDcc() {
    var add = UI.dview === "add";
    document.getElementById("dcc").innerHTML =
      '<aside class="dside"><div class="search">搜索</div>' +
      ['账户', '设备', '显示', '个性化', '网络', '声音', '电源', '系统'].map(function (n) { return '<div class="nav' + (n === "显示" ? " sel" : "") + '"><span class="ni">' + n[0] + '</span>' + n + '</div>'; }).join("") + '</aside>' +
      '<div class="dmain"><div class="titlebar"><span>显示 › ' + (add ? '<a data-d="main">显卡</a> › <b>添加应用</b>' : "<b>显卡</b>") + '</span><span class="wc" aria-hidden="true"><span>—</span><span>□</span><span>×</span></span></div>' +
      (add ? dccAdd() : dccMain(S)) + '</div>';
  }

  function render() { renderQuick(); renderDispSnip(); renderDcc(); }
  function setScen(key) {
    S = JSON.parse(JSON.stringify(SCEN[key]));
    document.querySelectorAll(".scen button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.scen === key)); });
    render();
  }
  function dAction(a) {
    if (a === "add") { UI.dview = "add"; UI.picked = {}; UI.file = null; UI.mkEntry = true; }
    else if (a === "main") UI.dview = "main";
    else if (a === "browse") UI.file = { name: "game.x86_64", dir: "~/Games/Hades" };
    else if (a === "unfile") UI.file = null;
    else if (a === "mkentry") UI.mkEntry = !UI.mkEntry;
    else if (a === "batt") UI.batt = !UI.batt;
    else if (a === "commit") {
      INSTALLED.forEach(function (x) { if (UI.picked[x[3]]) RULES.push({ kind: "app", id: x[3], name: x[0], col: x[1], ch: x[2] }); });
      if (UI.file) RULES.push({ kind: "file", name: UI.file.name, path: UI.file.dir });
      UI.dview = "main";
    }
    renderDcc();
  }
  document.addEventListener("click", function (e) {
    var t = e.target;
    var sb = t.closest(".scen button"); if (sb) { setScen(sb.dataset.scen); return; }
    var q = t.closest("[data-q]"); if (q) { UI.qview = q.dataset.q; renderQuick(); return; }
    var act = t.closest("[data-act]");
    if (act) { if (act.dataset.act === "undo") S.configured = S.active; if (act.dataset.act === "dismiss") S.banner = null; render(); return; }
    var d = t.closest("[data-d]"); if (d && !d.disabled) { dAction(d.dataset.d); return; }
    var pk = t.closest("[data-pick]"); if (pk && pk.dataset.pick) { UI.picked[pk.dataset.pick] = !UI.picked[pk.dataset.pick]; renderDcc(); return; }
    var del = t.closest("[data-del]"); if (del) { RULES.splice(Number(del.dataset.del), 1); renderDcc(); return; }
    var m = t.closest("[data-mode]");
    if (m && m.getAttribute("aria-disabled") !== "true") { S.configured = m.dataset.mode; if (S.banner === "fail") S.banner = null; render(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = e.target;
    if (t.matches && t.matches("[data-mode], [data-q], [data-d], [data-pick]")) { e.preventDefault(); t.click(); }
  });
  RULES = [
    { kind: "app", id: "steam", name: "Steam", col: "#1b2838", ch: "S" },
    { kind: "app", id: "blender", name: "Blender", col: "#e87d0d", ch: "B" },
    { kind: "file", name: "hollow_knight.x86_64", path: "~/Games/HollowKnight" }
  ];
  setScen("idle");
})();
</script>
