<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.agino.Gpu1"/>
  </policy>
  <!-- Authorization is done inside the daemon (polkit); everyone may call. -->
  <policy context="default">
    <allow send_destination="org.agino.Gpu1" send_interface="org.agino.Gpu1"/>
    <allow send_destination="org.agino.Gpu1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.agino.Gpu1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
